name: opencode-new-issue

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # One run per issue, so re-created/re-run events don't stack.
  group: opencode-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage new issue
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure triage labels
        shell: bash
        run: |
          set +e
          gh label create triage                --color ededed --force || true
          gh label create needs-info            --color fbca04 --force || true
          gh label create po-approved           --color 0e8a16 --force || true
          gh label create po-rejected           --color b60205 --force || true
          gh label create architect-approved    --color 0e8a16 --force || true
          gh label create architect-rejected    --color b60205 --force || true
          gh label create ready-for-implementation --color 1d76db --force || true
          gh label create risk-low              --color 0e8a16 --force || true
          gh label create risk-high             --color b60205 --force || true

      # Each stage runs opencode headlessly with a dedicated primary agent.
      # use_github_token: true lets them read/comment/edit issues and apply
      # labels with the workflow's GITHUB_TOKEN. Comments are authored by
      # github-actions[bot]. Stages read the prior stage's outcome from the
      # issue's comments/labels and skip gracefully if blocked.
      - name: Stage 1 - Translate & format
        uses: anomalyco/opencode/github@github-v1.2.25
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          agent: issue-cleaner
          use_github_token: true
          prompt: |
            A new issue was just opened in this repository: #${{ github.event.issue.number }}
            Clean it with `gh issue view ${{ github.event.issue.number }}`.

      - name: Clean working tree
        if: always()
        run: git reset --hard && git clean -fd

      - name: Stage 2 - Product owner review
        uses: anomalyco/opencode/github@github-v1.2.25
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          agent: po-review
          use_github_token: true
          prompt: |
            Review this issue as product owner: #${{ github.event.issue.number }}
            Fetch it with `gh issue view ${{ github.event.issue.number }}`.

      - name: Clean working tree
        if: always()
        run: git reset --hard && git clean -fd

      - name: Stage 3 - Architect review
        uses: anomalyco/opencode/github@github-v1.2.25
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          agent: architect-review
          use_github_token: true
          prompt: |
            Review this issue as architect: #${{ github.event.issue.number }}
            Fetch it with `gh issue view ${{ github.event.issue.number }}`.

      - name: Clean working tree
        if: always()
        run: git reset --hard && git clean -fd

      - name: Stage 4 - Implement
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          agent: github-issues
          use_github_token: true
          prompt: |
            Implement issue #${{ github.event.issue.number }}.
            Fetch it with `gh issue view ${{ github.event.issue.number }}`.
