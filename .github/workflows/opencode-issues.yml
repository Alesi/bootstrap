name: opencode-issues

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC (to save resources)
    - cron: '0 6 * * 1'
  # Allows manual execution from the GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-issues
  cancel-in-progress: true

jobs:
  opencode:
    name: Resolve open issues
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Runs opencode headlessly. The github-issues agent (defined in
      # .opencode/agent/github-issues.md) implements each issue that the
      # triage pipeline has labeled ready-for-implementation and opens a PR.
      # use_github_token: true lets it push branches and open PRs with the
      # workflow's GITHUB_TOKEN (no OpenCode App install needed). Commits and
      # PRs will be authored by github-actions[bot].
      - name: Run opencode
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          # Big Pickle is an OpenCode Zen model -> needs an OpenCode key.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          agent: github-issues
          use_github_token: true
          prompt: |
            Implement the issues in this repository that are labeled
            ready-for-implementation and do not already have a PR open.
            Work on one issue at a time, opening at most 3 PRs per run.

            Also, find all issues labeled needs-info. If any have had no
            activity (no comments) for more than 14 days, close them with
            a comment asking the reporter to reopen when the missing info
            is provided.
